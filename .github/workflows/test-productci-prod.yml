name: Product API CI Prod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-prod:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Product API did not become healthy"
          cat server.log
          exit 1

      - name: Test CREATE product
        run: |
          curl -f -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":1,"pname":"Laptop","price":15000000,"quantity":10}'

      - name: Test READ all products
        run: curl -f http://localhost:3000/api/products

      - name: Test READ product by pid
        run: curl -f http://localhost:3000/api/products/1

      - name: Test UPDATE product
        run: |
          curl -f -X PUT http://localhost:3000/api/products/1 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop Dell","price":16000000,"quantity":8}'

      - name: Test DELETE product
        run: curl -f -X DELETE http://localhost:3000/api/products/1

      - name: Show API logs
        if: always()
        run: cat server.log || true


          docker-publish:
    needs: test-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}